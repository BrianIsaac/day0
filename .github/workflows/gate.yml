name: Gate

on:
  push:
    branches: [main, staging, 'unit/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # The zone every step runs in, as vitest.config.ts pins it for the suite.
      TZ: UTC
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # One exact Node 22 release, the one local gates run too, so a red run
          # is reproducible on a workstation (undici and V8 differ between patches).
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: NEXT_PUBLIC_DEV_NO_AUTH= pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://convex.example.invalid
          NEXT_PUBLIC_CONVEX_SITE_URL: https://convex-site.example.invalid
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5pbnZhbGlkJA==
