name: Gate

on:
  push:
    branches: [main, staging, 'unit/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # The zone every step runs in, as vitest.config.ts pins it for the suite.
      TZ: UTC
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # One exact Node 22 release, the one local gates run too, so a red run
          # is reproducible on a workstation (undici and V8 differ between patches).
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: NEXT_PUBLIC_DEV_NO_AUTH= pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://convex.example.invalid
          NEXT_PUBLIC_CONVEX_SITE_URL: https://convex-site.example.invalid
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5pbnZhbGlkJA==

  # The accessibility floor (N14, CONTRIBUTING.md), as the tree's first browser
  # test: the public pages from this job's own build, checked with axe at 1440
  # by 900 and 390 by 844 (playwright.config.ts). The dashboard needs a backend
  # this runner does not hold, so its axe check and pressed-button tests run
  # under jsdom in the gate's own suite.
  browser:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TZ: UTC
      # The pages render from the build alone. The Clerk values are
      # production-shaped placeholders on a domain that cannot resolve: a
      # development key makes the middleware send every page load to its
      # handshake, and the middleware wants a secret key once it starts.
      NEXT_PUBLIC_CONVEX_URL: https://convex.example.invalid
      NEXT_PUBLIC_CONVEX_SITE_URL: https://convex-site.example.invalid
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_ZXhhbXBsZS5pbnZhbGlkJA==
      CLERK_SECRET_KEY: sk_live_placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: NEXT_PUBLIC_DEV_NO_AUTH= pnpm build
      - name: Browser tests
        run: pnpm test:browser
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .next/playwright
          retention-days: 7
