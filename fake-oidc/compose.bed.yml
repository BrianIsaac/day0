# The customer-local bed's additions to docker-compose.yml: the test issuer at
# a fixed address on the project's network, and the backend trusting the
# issuer's throwaway CA (fake-oidc/make-tls.sh) through SSL_CERT_FILE, which
# the pinned backend image's TLS roots honour. Compose reads COMPOSE_FILE from
# the process environment, not from the --env-file, and the setup pins it to
# the main file for its own children; so a bed runs the setup, then exports
#
#   COMPOSE_FILE=docker-compose.yml:fake-oidc/compose.bed.yml
#
# and recreates the stack (`docker compose ... down`, then `up -d --wait`;
# the volumes are kept) before anything else.
# The issuer is then https://${FAKE_OIDC_ADDRESS}:${FAKE_OIDC_PORT} from the
# backend container, from this machine's processes and from its browser alike
# (a Linux host reaches its bridge networks' addresses). Never on a customer
# install: a real issuer has a public certificate and a public name.
networks:
  default:
    ipam:
      config:
        - subnet: ${FAKE_OIDC_SUBNET:-172.31.250.0/24}

services:
  fake-oidc:
    networks:
      default:
        ipv4_address: ${FAKE_OIDC_ADDRESS:-172.31.250.10}
    # The authorisation server's protected MCP resource (11-AM), off unless a
    # bed names its path and its public client; the redirect is the app's
    # /api/oauth/mcp on the origin the bed's browser reaches.
    environment:
      - FAKE_OIDC_MCP_PATH=${FAKE_OIDC_MCP_PATH:-}
      - FAKE_OIDC_MCP_SCOPES=${FAKE_OIDC_MCP_SCOPES:-read write}
      - FAKE_OIDC_MCP_CLIENT_ID=${FAKE_OIDC_MCP_CLIENT_ID:-}
      - FAKE_OIDC_MCP_REDIRECT_URIS=${FAKE_OIDC_MCP_REDIRECT_URIS:-}

  # The backend's own TLS roots read SSL_CERT_FILE; its Node actions (the MCP
  # client's discovery and token requests) read NODE_EXTRA_CA_CERTS.
  backend:
    environment:
      - SSL_CERT_FILE=/fake-oidc-tls/bundle.pem
      - NODE_EXTRA_CA_CERTS=/fake-oidc-tls/ca.pem
    volumes:
      - ${FAKE_OIDC_TLS_DIR:-./fake-oidc/tls}:/fake-oidc-tls:ro
