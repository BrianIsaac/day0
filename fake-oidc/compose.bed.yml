# The customer-local bed's additions to docker-compose.yml: the test issuer at
# a fixed address on the project's network, and the backend trusting the
# issuer's throwaway CA (fake-oidc/make-tls.sh) through SSL_CERT_FILE, which
# the pinned backend image's TLS roots honour. A bed names this file after the
# main one in COMPOSE_FILE in its env file:
#
#   COMPOSE_FILE=docker-compose.yml:fake-oidc/compose.bed.yml
#
# The issuer is then https://${FAKE_OIDC_ADDRESS}:${FAKE_OIDC_PORT} from the
# backend container, from this machine's processes and from its browser alike
# (a Linux host reaches its bridge networks' addresses). Never on a customer
# install: a real issuer has a public certificate and a public name.
networks:
  default:
    ipam:
      config:
        - subnet: ${FAKE_OIDC_SUBNET:-172.31.250.0/24}

services:
  fake-oidc:
    networks:
      default:
        ipv4_address: ${FAKE_OIDC_ADDRESS:-172.31.250.10}

  backend:
    environment:
      - SSL_CERT_FILE=/fake-oidc-tls/bundle.pem
    volumes:
      - ${FAKE_OIDC_TLS_DIR:-./fake-oidc/tls}:/fake-oidc-tls:ro
