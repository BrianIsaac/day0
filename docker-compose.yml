# Self-hosted Convex backend - the same open-source binary the cloud service runs.
# Lets the whole of Day0 run locally with no Convex account.
#
# Adapted from the upstream reference compose file:
#   https://github.com/get-convex/convex-backend/blob/main/self-hosted/docker/docker-compose.yml
# The AWS/S3/MySQL/Postgres passthrough env vars are dropped - the default
# SQLite-in-a-volume storage is what local development wants. See upstream if you
# need external storage.
#
#   pnpm convex:up
#   pnpm convex:admin-key                                 # -> CONVEX_SELF_HOSTED_ADMIN_KEY
#
# Backend http://127.0.0.1:3210 · HTTP actions http://127.0.0.1:3211 · dashboard http://localhost:6791
#
# Two kinds of address live in this file, and they are not interchangeable.
#
# CONVEX_PORT, CONVEX_SITE_PROXY_PORT and CONVEX_DASHBOARD_PORT are *host* ports.
# Move them to run two backends side by side. Browsers, the Convex CLI and
# NEXT_PUBLIC_CONVEX_URL all reach the backend through them.
#
# CONVEX_CLOUD_ORIGIN and CONVEX_SITE_ORIGIN are what the backend calls itself
# from *inside* the container, and a Node action dials the first of them to reach
# the backend it is running for. The container listens on 3210 and 3211 whatever
# the host publishes, so these stay canonical rather than following the host
# ports. Setting them to a host port is the failure this file used to ship: the
# host mapping is right, the browser is fine, queries and mutations are fine, and
# every Node action fails with `Transient network error running query
# (ECONNREFUSED, 5 attempts)` against a port nothing is bound to in the
# container's own network namespace.
#
# Override them only with an address that resolves *inside* the container - a
# compose service name, or a host address reachable over the bridge. An address
# only your browser can resolve belongs in CONVEX_BROWSER_ORIGIN or
# NEXT_PUBLIC_CONVEX_URL instead.
#
# CONVEX_BIND_ADDR is the host address every port below is published on, and it
# defaults to loopback. It is read from `.env.local` because `pnpm convex:up`
# passes `--env-file .env.local`; plain `docker compose up` reads your shell or
# `.env` instead and will silently take the default.
#
# It is hygiene, not a boundary, and nothing else reads it. No-auth dev mode used
# to treat this value as evidence that the backend was unreachable from off the
# machine; it never was, because the socket is opened here and the guard ran over
# there. What holds that boundary now is a key the caller has to present, so
# widening this address exposes an unauthenticated backend to your network but
# does not let anyone act as the local boss. See `convex/devAuth.ts`.
#
# Container names are left to compose so that `-p <project>` is enough to run a
# second stack; a fixed name would collide on the first one started.
#
# The optional `model` service is the third address problem, and the one that
# costs an afternoon. Charter synthesis, plan drafting and skill authoring are
# Convex *Node actions*: they run inside the backend container, not in Next. So
# a local model server on `127.0.0.1` is reachable from the app and invisible to
# the backend, and the loop half-works - the Day-1 chat streams and the charter
# never arrives. Running the model as a service here puts it on the same network
# under a name the backend can resolve, which is why it is bundled rather than
# left to the reader. It is opt-in: nothing starts it without `--profile model`.
#
# Its GPU reservation lives in docker-compose.gpu.yml, which `pnpm model:up`
# layers on top when this machine can satisfy it. This file alone starts
# anywhere.
#
# The optional `sandbox` service is the same idea for the other half of the
# loop. Skill verification runs a smoke test somewhere isolated, Daytona needs
# an account, and a skill nothing ran is not a verified skill - so the
# account-free route could author a skill and never register one. It is opt-in
# the same way (`pnpm sandbox:up`), and it is reached over a unix socket rather
# than a port, which is the whole of its network story: see the service.

services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - '${CONVEX_BIND_ADDR:-127.0.0.1}:${CONVEX_PORT:-3210}:3210'
      - '${CONVEX_BIND_ADDR:-127.0.0.1}:${CONVEX_SITE_PROXY_PORT:-3211}:3211'
    volumes:
      - convex_data:/convex/data
      # Owner-linked documentation is visible to Node actions but never writable
      # from the backend. DAY0_DOCS_HOST_DIR is a host path; actions use /docs.
      - type: bind
        source: ${DAY0_DOCS_HOST_DIR:?Set DAY0_DOCS_HOST_DIR to an existing documentation directory}
        target: /docs
        read_only: true
        bind:
          create_host_path: false
      # Where the `sandbox` service below puts its socket. Mounted whether or
      # not that service is running, so that starting it later needs nothing
      # here: an empty volume reads as "no local sandbox", which is exactly
      # what it means, and the skill loop reports the honest skip.
      - sandbox_socket:/run/day0-sandbox
    # Lets CONVEX_OPENAI_BASE_URL name a model server running on this host
    # rather than in a container. Whether it can actually be reached is a
    # question for your firewall: some hosts drop traffic from the bridge, and
    # `pnpm model:up` sidesteps the question entirely.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      # Functions read this back as `process.env.CONVEX_CLOUD_URL` and Node
      # actions call the backend on it, so it names the container's own
      # listener rather than whatever the host publishes.
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      # No phone-home from a local dev backend.
      - DISABLE_BEACON=true
      - DISABLE_METRICS_ENDPOINT=true
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - '${CONVEX_BIND_ADDR:-127.0.0.1}:${CONVEX_DASHBOARD_PORT:-6791}:6791'
    environment:
      # Resolved by the browser rendering the dashboard, not by the container,
      # so this one does follow the published host port. Set
      # CONVEX_BROWSER_ORIGIN when the browser reaches the backend by some
      # other name - a LAN address, a tunnel - than the address it is bound to.
      - NEXT_PUBLIC_DEPLOYMENT_URL=${CONVEX_BROWSER_ORIGIN:-http://127.0.0.1:${CONVEX_PORT:-3210}}
    depends_on:
      backend:
        condition: service_healthy

  # An OpenAI-compatible model server, so the account-free path needs no
  # provider at all. Opt in with `pnpm model:up`, then pull a model:
  #
  #   pnpm model:up
  #   pnpm model:pull qwen3:8b        # ~5 GB, tool-capable, runs the whole loop
  #
  # `pnpm model:up` adds docker-compose.gpu.yml when this machine has an NVIDIA
  # driver Docker can hand over, so the acceleration is the default rather than
  # something to find. Starting the service straight from this file - no
  # overlay - is the CPU configuration, and every machine can run it.
  #
  # Two addresses again, and for once both are wanted. The backend reaches it at
  # http://model:11434/v1 over this network (CONVEX_OPENAI_BASE_URL); Next
  # reaches it on the published host port (OPENAI_BASE_URL). Skip this service
  # entirely if you already have an endpoint - it is a convenience, not a
  # dependency.
  model:
    profiles: ['model']
    image: ollama/ollama:latest
    stop_grace_period: 10s
    ports:
      - '${CONVEX_BIND_ADDR:-127.0.0.1}:${MODEL_PORT:-11434}:11434'
    volumes:
      - model_data:/root/.ollama

  # Runs the smoke test that decides whether an authored skill becomes
  # callable, so that the account-free route can finish the skill loop:
  #
  #   pnpm sandbox:up
  #
  # Every line below is part of the boundary, not configuration around it.
  #
  # `network_mode: none` is the load-bearing one, and it is why the backend
  # reaches this over a unix socket on a shared volume instead of over a port.
  # A service on the compose network would put model-authored Python one DNS
  # name away from the Convex backend and the model server; with no interface
  # at all it is one away from nothing. The authoring prompt tells the model
  # its smoke test gets a bare Python 3.12 with no third-party packages and
  # must mock external calls, so nothing legitimate wants a network here.
  #
  # The obvious alternative - mounting the Docker socket so the backend can
  # spawn a sandbox per skill - is deliberately not taken. It hands every
  # reader's machine a root-equivalent socket to code a model wrote.
  #
  # The container starts as root, binds the socket on the volume Docker owns,
  # and then drops to `nobody` for good; every smoke test inherits that. Root
  # keeps only the two capabilities that drop needs. The root filesystem is
  # read-only and the working directory is a 64 MB tmpfs, so a smoke test
  # leaves nothing behind for the next one.
  #
  # It restarts because it supervises code it does not trust: a smoke test
  # shares a uid with the server and could stop it serving, which should cost
  # a restart rather than the rest of the session.
  sandbox:
    profiles: ['sandbox']
    image: python:3.12-slim
    restart: unless-stopped
    stop_grace_period: 5s
    network_mode: none
    read_only: true
    cap_drop: ['ALL']
    cap_add: ['SETUID', 'SETGID']
    security_opt: ['no-new-privileges:true']
    pids_limit: 96
    mem_limit: 512m
    command: ['python3', '-u', '/opt/day0/skill_sandbox.py']
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      # 60 seconds is what the Daytona path allows a smoke test, and the two
      # backends should not disagree about what "too slow" means.
      - SANDBOX_TIMEOUT_SECONDS=${SKILL_SANDBOX_TIMEOUT_SECONDS:-60}
    volumes:
      - ./sandbox/skill_sandbox.py:/opt/day0/skill_sandbox.py:ro
      - sandbox_socket:/run/day0-sandbox
    # Handed straight to the unprivileged user the server drops to, so that
    # preparing it needs no capability the drop would otherwise have to keep.
    # 65534 is `nobody` on this image.
    tmpfs:
      - /run/sandbox-work:size=64m,mode=700,uid=65534,gid=65534,nosuid,nodev,noexec
    healthcheck:
      test: ['CMD', 'python3', '/opt/day0/skill_sandbox.py', '--health']
      interval: 15s
      timeout: 10s
      start_period: 5s

  # Reads an operator-owned Notion workspace through Streamable HTTP. The port
  # is unpublished and each initialisation supplies its own Notion credential.
  #
  # The healthcheck is a real MCP initialise, and the server keeps every
  # session it initialises (with a per-token API proxy each) until a DELETE
  # arrives, so the check terminates its own session or six of them would
  # accumulate a minute for as long as the container runs.
  notion-mcp:
    profiles: ['real']
    image: node:22-alpine
    command:
      [
        'sh',
        '-lc',
        'npx -y @notionhq/notion-mcp-server@2.5.1 --transport http --host 0.0.0.0 --port 3000 --enable-token-passthrough',
      ]
    environment:
      - AUTH_TOKEN=${DAY0_NOTION_MCP_AUTH_TOKEN:?Run pnpm dev once to generate the Notion MCP transport token}
    expose: ['3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const token=['nt','n_','h'.repeat(46)].join('');const url='http://127.0.0.1:3000/mcp';const auth='Bearer '+process.env.AUTH_TOKEN;fetch(url,{method:'POST',headers:{accept:'application/json, text/event-stream',authorization:auth,'content-type':'application/json','notion-token':token},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-06-18',capabilities:{},clientInfo:{name:'healthcheck',version:'1'}}})}).then(async r=>{const body=await r.text();const session=r.headers.get('mcp-session-id');if(session){await fetch(url,{method:'DELETE',headers:{authorization:auth,'mcp-session-id':session}}).catch(()=>{})}process.exit(r.ok&&body.includes('protocolVersion')?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s

  # A synthetic system with a web UI and no API: the case Day0 claims to be
  # honest about. Nothing reaches it but a browser, so it is what the browser
  # floor is demonstrated against. Unpublished, like every other real-profile
  # service; the agent reaches it by service name over the compose network.
  looker-tile:
    profiles: ['real']
    image: node:22-alpine
    command: ['node', '/app/server.js']
    environment:
      - LOOKER_TILE_PORT=8080
      - LOOKER_TILE_USER=${LOOKER_TILE_USER:-revops}
      - LOOKER_TILE_PASSWORD=${LOOKER_TILE_PASSWORD:-pipeline-tile-local}
    volumes:
      - ./looker-tile/server.js:/app/server.js:ro
    expose: ['8080']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s

  # The browser floor drives that UI through Day0's per-surface tool allowlist.
  # The MCP server itself is not a security boundary, so it remains internal.
  #
  # `--isolated` gives every MCP session its own browser context. Day0 opens
  # one session per `mcp.call` and closes it afterwards; without the flag the
  # server keeps a single shared browser and the second call in a run fails
  # with "Browser is already in use", so a skill could navigate but never
  # snapshot. Sessions share no page state, which is also what an audited
  # per-action call should mean.
  playwright-mcp:
    profiles: ['real']
    image: mcr.microsoft.com/playwright/mcp:latest
    command:
      [
        '--isolated',
        '--port',
        '8931',
        '--host',
        '0.0.0.0',
        '--allowed-hosts',
        'playwright-mcp:8931,localhost:8931,127.0.0.1:8931',
        '--allowed-origins',
        '${PLAYWRIGHT_ALLOWED_ORIGINS:-http://looker-tile:8080;http://host.docker.internal:3000}',
      ]
    expose: ['8931']
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8931/mcp').then(() => process.exit(0)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s

volumes:
  convex_data:
  model_data:
  # Carries one unix socket between the backend and the sandbox. It is the only
  # thing the two share, and the only way into a container that has no network.
  sandbox_socket:
