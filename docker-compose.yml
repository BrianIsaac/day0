# Self-hosted Convex backend — the same open-source binary the cloud service runs.
# Lets the whole of Day0 run locally with no Convex account.
#
# Adapted from the upstream reference compose file:
#   https://github.com/get-convex/convex-backend/blob/main/self-hosted/docker/docker-compose.yml
# The AWS/S3/MySQL/Postgres passthrough env vars are dropped — the default
# SQLite-in-a-volume storage is what local development wants. See upstream if you
# need external storage.
#
#   docker compose up -d
#   docker compose exec backend ./generate_admin_key.sh   # -> CONVEX_SELF_HOSTED_ADMIN_KEY
#
# Backend http://127.0.0.1:3210 · HTTP actions http://127.0.0.1:3211 · dashboard http://localhost:6791
#
# CONVEX_BIND_ADDR is the host address every port below is published on, and it
# defaults to loopback: this backend has no authentication of its own, and in
# no-auth dev mode it mints a fixed identity that owns every row. The same
# variable is pushed to the deployment by `scripts/sync-convex-env.sh` and is
# what `convex/devAuth.ts` checks, so widening it here disables no-auth mode
# rather than quietly exposing it.

services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    container_name: day0-convex-backend
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - '${CONVEX_BIND_ADDR:-127.0.0.1}:${CONVEX_PORT:-3210}:3210'
      - '${CONVEX_BIND_ADDR:-127.0.0.1}:${CONVEX_SITE_PROXY_PORT:-3211}:3211'
    volumes:
      - convex_data:/convex/data
    environment:
      # Functions read this back as `process.env.CONVEX_CLOUD_URL`. The no-auth
      # dev identity in `convex/devAuth.ts` refuses to mint unless it is loopback,
      # so leaving this at the default is part of that safety check.
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${CONVEX_PORT:-3210}}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${CONVEX_SITE_PROXY_PORT:-3211}}
      # No phone-home from a local dev backend.
      - DISABLE_BEACON=true
      - DISABLE_METRICS_ENDPOINT=true
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    container_name: day0-convex-dashboard
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - '${CONVEX_BIND_ADDR:-127.0.0.1}:${CONVEX_DASHBOARD_PORT:-6791}:6791'
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${CONVEX_PORT:-3210}}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  convex_data:
