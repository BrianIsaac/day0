<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 16 16">
  <!-- The mark of app/icon.svg for Clerk's card (clerk-appearance.ts): the head in the accent, the
       eyes cut out of it, so they are the colour of the card the mark is drawn on, as the header's
       BrandMark cuts them in the page's. An image Clerk loads by URL cannot read the page's
       tokens, so the head's colour is the accent's value in each set. Chromium and Firefox answer
       the query from the colour-scheme of the page that draws the image, so the head follows the
       theme the viewer chose; WebKit answers it from the system (probed in Playwright's Firefox
       155 and WebKit 2359, 13 October 2026), so there the head is the system's set, and a cut eye
       is right whichever set that is. -->
  <style>
    .head { fill: #22d3ee; }
    @media (prefers-color-scheme: light) {
      .head { fill: #0e7490; }
    }
  </style>
  <g mask="url(#eyes)">
    <rect x="7" y="0" width="2" height="5" rx="1" class="head" />
    <rect x="1" y="4" width="14" height="11" rx="3.5" class="head" />
  </g>
  <mask id="eyes">
    <path d="M0 0h16v16H0z" fill="#fff" />
    <rect x="3" y="8" width="4" height="3" rx="0.75" fill="#000" />
    <rect x="9" y="8" width="4" height="3" rx="0.75" fill="#000" />
  </mask>
</svg>
