<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 16 16">
  <!-- The mark of app/icon.svg for Clerk's card (clerk-appearance.ts): the head in the accent, the
       eyes cut in the card's own colour, as the header's BrandMark cuts them in the page's. An
       image Clerk loads by URL cannot read the page's tokens, so the colours are the tokens'
       values in each set; Chromium answers the query from the colour-scheme of the page that draws
       the image, so the mark follows the theme the viewer chose (Firefox and Safari not probed). -->
  <style>
    .head { fill: #22d3ee; }
    .eye { fill: #18181b; }
    @media (prefers-color-scheme: light) {
      .head { fill: #0e7490; }
      .eye { fill: #ffffff; }
    }
  </style>
  <rect x="7" y="0" width="2" height="5" rx="1" class="head" />
  <rect x="1" y="4" width="14" height="11" rx="3.5" class="head" />
  <rect x="3" y="8" width="4" height="3" rx="0.75" class="eye" />
  <rect x="9" y="8" width="4" height="3" rx="0.75" class="eye" />
</svg>
