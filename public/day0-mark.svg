<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 16 16">
  <!-- The mark of app/icon.svg for Clerk's dark card (#18181b, clerk-appearance.ts): the head in
       the accent, the eyes cut in the card's own colour, as the header's BrandMark cuts them in
       the page's. An image Clerk loads by URL cannot read the page's tokens, so the colours are
       the tokens' dark values. -->
  <rect x="7" y="0" width="2" height="5" rx="1" fill="#22d3ee" />
  <rect x="1" y="4" width="14" height="11" rx="3.5" fill="#22d3ee" />
  <rect x="3" y="8" width="4" height="3" rx="0.75" fill="#18181b" />
  <rect x="9" y="8" width="4" height="3" rx="0.75" fill="#18181b" />
</svg>
